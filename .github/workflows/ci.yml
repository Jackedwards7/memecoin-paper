# Runs the offline test suite on any change to code, tests or rules. Book-only commits (the
# watcher's marks, the cloud review's trades) don't trigger it. No secrets, no network calls.
name: tests
on:
  push:
    branches: [main]
    paths: ["memepaper.py", "sync.sh", "tests/**", "CLAUDE.md", ".github/workflows/**"]
  pull_request:
    paths: ["memepaper.py", "sync.sh", "tests/**", "CLAUDE.md", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -I -W error::DeprecationWarning -m unittest discover -s tests -t . -v
