# Runs the offline test suite on every pull request and on code pushes to main. State-branch
# commits (the loop's ticks, orders) never trigger it. No secrets, no network calls.
name: tests
on:
  push:
    branches: [main]
    paths: ["memepaper.py", "order.sh", "mirror.sh", "tests/**", "CLAUDE.md", ".github/workflows/**"]
  pull_request:  # every PR, so the required check on main always reports
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -I -W error::DeprecationWarning -m unittest discover -s tests -t . -v
      - uses: actions/setup-python@v5  # the server's Ubuntu 24.04 has 3.12
        with:
          python-version: "3.12"
      - run: python3 -I -W error::DeprecationWarning -m unittest discover -s tests -t .
