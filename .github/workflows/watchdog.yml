# Alerts when the hot loop's last pushed tick is more than 20 minutes old, at most once an hour.
# A separate workflow, so a dead or stuck loop can't silence its own alarm.
name: watchdog
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
concurrency:
  group: watchdog
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check out the state branch
        run: |
          git fetch -q origin state
          git worktree add -q -B state state-wt origin/state
          git -C state-wt config user.name "memepaper watchdog"
          git -C state-wt config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check
        env:
          MEMEPAPER_STATE: state-wt
          MEMEPAPER_SHADOW: ${{ vars.MEMEPAPER_SHADOW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -I memepaper.py watchdog
