# The always-on hot loop (Tier 1 phase 2). Each run ticks every 60 s for 55 minutes. Each run
# starts its own successor, first thing and again at the end, and the concurrency group holds it
# until this one ends, so one is always waiting. GitHub's cron is only the backup: on 2026-11-03 it
# fired zero times in the first hour. To stop the chain, disable the workflow first. Books live on
# the `state` branch and this job is their only writer. Paper only: public prices, no wallet, no
# keys. The secrets are the ntfy topic and a read-only token for the Grok scout's files.
name: hot loop
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: hot-loop
  cancel-in-progress: false
permissions:
  contents: write
  actions: write  # to start the next run
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      NEXT_RUN: gh workflow run hot-loop.yml --ref main -R ${{ github.repository }}
    steps:
      - name: Queue the next run
        continue-on-error: true  # the end of this run tries again, and the cron backs it up
        run: $NEXT_RUN
      - uses: actions/checkout@v4
      - name: Check out the state branch
        run: |
          git fetch -q origin state
          git worktree add -q -B state state-wt origin/state
          git -C state-wt config user.name "memepaper hot loop"
          git -C state-wt config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Loop
        env:
          MEMEPAPER_STATE: state-wt
          MEMEPAPER_BY: hot-loop
          MEMEPAPER_SHADOW: ${{ vars.MEMEPAPER_SHADOW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DESK_TOKEN: ${{ secrets.DESK_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
        run: python3 -I memepaper.py loop --minutes 55 --every 60
      - name: Queue the next run again, on the code as it is now
        if: always()
        run: $NEXT_RUN
